name: Build Yandex package

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "index.html"
      - "styles.css"
      - "LICENSE"
      - "SOURCE.md"
      - "src/**"
      - "tools/**"
      - ".github/workflows/build-yandex.yml"

concurrency:
  group: yandex-build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 45

    steps:
      - name: Checkout Yandex wrapper
        uses: actions/checkout@v4

      - name: Checkout official The Powder Toy source
        uses: actions/checkout@v4
        with:
          repository: The-Powder-Toy/The-Powder-Toy
          ref: v100.1.400
          path: upstream

      - name: Install build tools
        run: |
          python3 -m pip install --user --upgrade meson ninja selenium
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Check non-blocking Yandex SDK loader
        run: |
          set -euo pipefail
          if grep -Fn '<script src="/sdk.js"></script>' index.html; then
            echo "Blocking Yandex SDK script tag returned."
            exit 1
          fi
          grep -Fn 'script.src = "/sdk.js";' src/yandex.js
          grep -Fn 'script.async = true;' src/yandex.js
          grep -Fn 'loadYandexSDKScript().then' src/yandex.js
          echo "Yandex SDK async loader audit: OK"

      - name: Check Russian font coverage
        run: |
          python3 tools/check-font.py

      - name: Check complete Russian element localization
        run: |
          python3 tools/check-element-localization.py

      - name: Restore Emscripten build cache
        id: emscripten-build-cache
        uses: actions/cache@v4
        with:
          path: upstream/build
          # The build directory contains object files compiled from sources
          # rewritten by tools/patch-upstream.py. Never fall back to a cache
          # produced by a different patch revision: Ninja can otherwise reuse
          # stale Emscripten objects and silently mix old/new main-loop logic.
          key: tpt-yandex-v100.1.400-emsdk-3.1.72-wasm32-emscripten-static-release-nohttp-${{ runner.os }}-${{ hashFiles('upstream/.github/build.sh') }}-${{ hashFiles('tools/patch-upstream.py') }}

      - name: Apply Yandex Web patches
        run: |
          python3 tools/patch-upstream.py

      - name: Check patched TPT source has no browser timing override
        run: |
          set -euo pipefail
          if grep -RIn --include='*.cpp' --include='*.h' 'emscripten_set_main_loop_timing' upstream/src; then
            echo "TPT source still overrides the Emscripten browser main-loop timing."
            exit 1
          fi
          echo "TPT browser timing override audit: OK"

      - name: Check Yandex UI has no external links
        run: |
          set -euo pipefail
          if grep -RInE 'https?://' upstream/src/gui; then
            echo "Absolute external URL remains in player-facing Yandex GUI source."
            exit 1
          fi
          if grep -RInE 'powdertoy\.co\.uk|tpt\.io|irc\.libera\.chat|github\.com/The-Powder-Toy|starcatcher\.us' upstream/src/gui; then
            echo "External service marker remains in player-facing Yandex GUI source."
            exit 1
          fi
          echo "Yandex GUI absolute external-link audit: OK"

      - name: Check browser external navigation is disabled
        run: |
          set -euo pipefail
          PLATFORM_FILE="upstream/src/common/platform/Emscripten.cpp"

          grep -Fn 'Yandex Web: external URI navigation is disabled.' "$PLATFORM_FILE"
          grep -Fn '(void)uri;' "$PLATFORM_FILE"
          grep -Fn 'External URI blocked in Yandex build.' "$PLATFORM_FILE"

          if grep -Fn 'open(UTF8ToString($0))' "$PLATFORM_FILE"; then
            echo "Emscripten Platform::OpenURI can still navigate the browser."
            exit 1
          fi

          if grep -En 'window\.(open|location)|location\.(assign|replace)|document\.location' upstream/src/common/platform/Emscripten.cpp; then
            echo "Browser navigation primitive remains in the Emscripten platform sink."
            exit 1
          fi

          echo "Browser external-navigation sink: disabled"

      - name: Check browser online controllers are compiled out
        run: |
          set -euo pipefail
          CONTROLLER="upstream/src/gui/game/GameController.cpp"
          python3 - <<'PY'
          from pathlib import Path

          text = Path("upstream/src/gui/game/GameController.cpp").read_text(
              encoding="utf-8"
          )
          methods = (
              "void GameController::OpenSearch(String searchText)",
              "void GameController::OpenSaveDone()",
              "void GameController::OpenSavePreview(int saveID, int saveDate, SavePreviewType savePreviewType)",
              "void GameController::OpenSavePreview()",
              "void GameController::OpenLogin()",
              "void GameController::OpenProfile()",
              "void GameController::OpenTags()",
          )
          guard = (
              "#if defined(__EMSCRIPTEN__)\n"
              "\t// Yandex Web: upstream online controller path disabled.\n"
              "\treturn;\n#else"
          )
          for method in methods:
              start = text.find(method)
              if start < 0:
                  raise SystemExit(f"Missing patched controller method: {method}")
              body = text[start:start + 500]
              if guard not in body:
                  raise SystemExit(
                      f"Online controller method is not Emscripten-disabled: {method}"
                  )
          print("Browser upstream online-controller guards: OK")
          PY

      - name: Check player-facing UI has no build diagnostics
        run: |
          set -euo pipefail
          INTRO="upstream/src/gui/game/IntroText.h"
          GAME_VIEW="upstream/src/gui/game/GameView.cpp"

          python3 - <<'PY'
          from pathlib import Path

          intro_text = Path("upstream/src/gui/game/IntroText.h").read_text(
              encoding="utf-8"
          )
          marker = "inline ByteString IntroText()"
          if marker not in intro_text:
              raise SystemExit("IntroText() missing after Yandex patch")

          player_intro = intro_text.split(marker, 1)[1]
          forbidden = (
              "VersionInfo()",
              "NOHTTP",
              "USE_UPDATESERVER",
              "starcatcher",
              "tptserv",
              "powdertoy.co.uk",
              "irc.libera.chat",
              "tpt.io/discord",
              "Server features are disabled",
              "Saves in this build",
              "Серверные функции отключены",
              "Сохранения этой версии",
          )
          found = [value for value in forbidden if value in player_intro]
          if found:
              raise SystemExit(
                  "Technical/network marker remains in player-facing IntroText: "
                  + ", ".join(found)
              )
          print("Player-facing IntroText diagnostics: clean")
          PY

          if grep -EIn 'unavailable in this build|недоступн.{0,20}верс' "$GAME_VIEW"; then
            echo "Technical unavailable-build wording remains in player-facing GameView."
            exit 1
          fi

          python3 - <<'PY'
          from pathlib import Path

          text = Path("upstream/src/gui/game/GameController.cpp").read_text(
              encoding="utf-8"
          )
          required = (
              "void GameController::Install()\n"
              "{\n"
              "#if defined(__EMSCRIPTEN__)\n"
              "\t// Yandex Web: desktop OS installation is not applicable in a browser.\n"
              "\treturn;\n"
              "#else"
          )
          if required not in text:
              raise SystemExit(
                  "Browser GameController::Install() is not guarded from desktop dialogs"
              )
          print("Browser desktop-install dialog guard: OK")
          PY

          echo "Player-facing technical-message audit: OK"

      - name: Check Web hot-path optimizations
        run: |
          set -euo pipefail
          grep -Fn 'bool yandexWebNeedsFlatten = false;' upstream/src/simulation/Simulation.cpp
          grep -Fn 'if (yandexWebNeedsFlatten)' upstream/src/simulation/Simulation.cpp
          python3 - <<'PY'
          from pathlib import Path
          text = Path("upstream/src/simulation/Simulation.cpp").read_text(encoding="utf-8")
          start = text.find("void Simulation::RecalcFreeParticles")
          first = text.find("yandexWebNeedsFlatten")
          if start < 0 or first < start:
              raise SystemExit("Recalc flatten guard leaked outside RecalcFreeParticles")
          print("RecalcFreeParticles optimization scope: OK")
          PY
          grep -Fn 'bool yandexWebHasFire = false;' upstream/src/graphics/Renderer.cpp
          grep -Fn 'if (!yandexWebHasFire)' upstream/src/graphics/Renderer.cpp
          echo "Profile-driven Web hot-path guards: OK"

      - name: Check reachable local UI localization
        run: |
          set -euo pipefail
          if grep -Fn 'ui::Point(40, 17), "Done");' upstream/src/gui/colourpicker/ColourPickerActivity.cpp; then
            echo "Colour picker still exposes an English-only Done button."
            exit 1
          fi
          if grep -Fn 'copyTextLabel->SetText("Copied!");' upstream/src/gui/interface/CopyTextButton.cpp; then
            echo "Copy feedback still exposes English-only text."
            exit 1
          fi
          grep -Fn 'YandexWebText("Done", "Готово")' upstream/src/gui/colourpicker/ColourPickerActivity.cpp
          grep -Fn 'YandexWebText("Copied!", "Скопировано!")' upstream/src/gui/interface/CopyTextButton.cpp
          grep -Fn 'YandexWebToolButtonText(tool->Identifier, tool->Name, tool->Description)' upstream/src/gui/game/GameView.cpp
          grep -Fn 'YandexWebToolButtonText(tool->Identifier, tool->Name, tool->Description)' upstream/src/gui/elementsearch/ElementSearchActivity.cpp
          grep -Fn 'YW_TOOL("DEFAULT_PT_DUST", "ПЫЛЬ")' upstream/src/YandexWebLocale.h
          grep -Fn 'ButtonText(YandexWebTranslateUi(buttonText))' upstream/src/gui/interface/Button.cpp
          grep -Fn 'toolTip(YandexWebTranslateUi(toolTip))' upstream/src/gui/interface/Button.cpp
          grep -Fn 'text(YandexWebTranslateUi(text))' upstream/src/gui/interface/Checkbox.cpp
          grep -Fn 'this->text = YandexWebTranslateUi(text);' upstream/src/gui/interface/Checkbox.cpp
          grep -Fn 'TextPosition(YandexWebTranslateUi(options[optionIndex].first))' upstream/src/gui/interface/DropDown.cpp
          grep -Fn 'BlendText(Position + textPosition, YandexWebTranslateUi(options[optionIndex].first)' upstream/src/gui/interface/DropDown.cpp
          grep -Fn 'YandexWebTranslateUi(newToolTip)' upstream/src/gui/interface/Button.h
          grep -Fn 'Text(YandexWebTranslateUi(text))' upstream/src/gui/interface/ContextMenu.h
          grep -Fn 'SetText(YandexWebTranslateUi(labelText))' upstream/src/gui/interface/Label.cpp
          grep -Fn 'placeHolder = YandexWebTranslateUi(textboxPlaceholder);' upstream/src/gui/interface/Textbox.cpp
          grep -Fn 'YW_UI("Save", "Сохранить")' upstream/src/YandexWebLocale.h
          grep -Fn 'YW_UI("Open", "Открыть")' upstream/src/YandexWebLocale.h
          grep -Fn 'YW_UI("Cancel", "Отмена")' upstream/src/YandexWebLocale.h
          grep -Fn 'YW_UI("Fancy Display", "Эффекты")' upstream/src/YandexWebLocale.h
          grep -Fn 'YW_UI("Pressure Display", "Давление")' upstream/src/YandexWebLocale.h
          grep -Fn 'YW_UI("Vorticity Display", "Завихренность")' upstream/src/YandexWebLocale.h
          if grep -Fn 'new ErrorMessage("Error loading save", "Dropped save file could not be loaded: " + saveFile->GetError());' upstream/src/gui/game/GameView.cpp; then
            echo "Dropped-save error is still English-only."
            exit 1
          fi
          if grep -Fn 'new ErrorMessage("Could not create stamp", "Error serializing save file");' upstream/src/gui/game/GameController.cpp; then
            echo "Stamp serialization error is still English-only."
            exit 1
          fi
          if grep -Fn 'new ErrorMessage("Could not create stamp", "Error generating save file");' upstream/src/gui/game/GameController.cpp; then
            echo "Stamp generation error is still English-only."
            exit 1
          fi
          if grep -Fn ', " Total:", std::hypot' upstream/src/gui/options/OptionsView.cpp; then
            echo "Custom-gravity magnitude label is still English-only."
            exit 1
          fi
          grep -Fn 'YandexWebText("Dropped save file could not be loaded: ", "Не удалось загрузить перетащенное сохранение: ")' upstream/src/gui/game/GameView.cpp
          grep -Fn 'YandexWebText("Could not create stamp", "Не удалось создать штамп")' upstream/src/gui/game/GameController.cpp
          grep -Fn 'YandexWebText(" Total:", " Модуль:")' upstream/src/gui/options/OptionsView.cpp
          grep -Fn 'const AD_INTERVAL_MS = 120000;' src/main.js
          grep -Fn 'const AD_WARNING_SECONDS = 2;' src/main.js
          grep -Fn 'showFullscreenAdv' src/yandex.js
          echo "Reachable local UI localization audit: OK"

      - name: Build upstream Emscripten target without external HTTP features
        if: steps.emscripten-build-cache.outputs.cache-hit != 'true'
        working-directory: upstream
        env:
          BSH_BUILD_PLATFORM: linux
          BSH_HOST_ARCH: wasm32
          BSH_HOST_PLATFORM: emscripten
          BSH_HOST_LIBC: emscripten
          BSH_STATIC_DYNAMIC: static
          BSH_DEBUG_RELEASE: release
          BSH_LINT: "no"
          RELEASE_NAME: dev
          RELEASE_TYPE: dev
          MOD_ID: "0"
          SEPARATE_DEBUG: "no"
          PACKAGE_MODE: nohttp
          ASSET_PATH: powder.tar
          DEBUG_ASSET_PATH: powder.wasm.dbg
          APP_NAME: The Powder Toy
          APP_COMMENT: The Powder Toy - Yandex Games Web build
          APP_EXE: powder
          APP_ID: org.powdertoy.tpt.yandex
          APP_DATA: powdertoy
          APP_VENDOR: powdertoy
        run: |
          chmod +x .github/build.sh
          ./.github/build.sh

      - name: Verify compiled no-HTTP configuration
        run: |
          set -euo pipefail
          CONFIG_FILE="upstream/build/src/Config.h"
          test -f "$CONFIG_FILE"

          grep -Fn 'constexpr bool NOHTTP                   = true;' "$CONFIG_FILE"
          grep -Fn 'constexpr bool USE_UPDATESERVER         = false;' "$CONFIG_FILE"
          grep -Fn 'constexpr bool IGNORE_UPDATES           = true;' "$CONFIG_FILE"
          grep -Fn 'FORCE_WINDOW_FRAME_OPS = forceWindowFrameOpsEmbedded;' "$CONFIG_FILE"
          grep -Fn 'constexpr char SERVER[]         = "";' "$CONFIG_FILE"
          grep -Fn 'constexpr char STATICSERVER[]   = "";' "$CONFIG_FILE"

          if grep -Fi 'powdertoy.co.uk' "$CONFIG_FILE"; then
            echo "Upstream simulation server remains in compiled Config.h."
            exit 1
          fi
          if grep -Fi 'static.powdertoy.co.uk' "$CONFIG_FILE"; then
            echo "Upstream static server remains in compiled Config.h."
            exit 1
          fi

          if grep -Fn 'constexpr bool NOHTTP                   = false;' "$CONFIG_FILE"; then
            echo "HTTP support is enabled in the compiled Yandex build."
            exit 1
          fi
          if grep -Fn 'constexpr bool USE_UPDATESERVER         = true;' "$CONFIG_FILE"; then
            echo "Update server support is enabled in the compiled Yandex build."
            exit 1
          fi

          echo "Compiled Yandex configuration: NOHTTP, no update server"

      - name: Verify Lua has no network backend
        run: |
          set -euo pipefail
          LUA_SCRIPT="upstream/src/lua/LuaScriptInterface.cpp"
          LUA_MISC="upstream/src/lua/LuaMisc.cpp"
          BUILD_NINJA="upstream/build/build.ninja"

          LUA_PLATFORM="upstream/src/lua/LuaPlatform.cpp"

          grep -Fn 'Yandex Web: Lua HTTP API disabled in browser builds.' "$LUA_SCRIPT"

          python3 - <<'PY'
          from pathlib import Path

          checks = {
              "upstream/src/lua/LuaScriptInterface.cpp": [
                  "#if !defined(__EMSCRIPTEN__)\n\tLuaHttp::Open(L);\n#endif",
              ],
              "upstream/src/lua/LuaMisc.cpp": [
                  "#if !defined(__EMSCRIPTEN__)\nstatic int installScriptManager",
                  "#if !defined(__EMSCRIPTEN__)\n\t\tLFUNC(installScriptManager),\n#endif",
              ],
              "upstream/src/lua/LuaPlatform.cpp": [
                  "#if !defined(__EMSCRIPTEN__)\nstatic int openLink",
                  "#if !defined(__EMSCRIPTEN__)\n\t\tLFUNC(openLink),\n#endif",
              ],
          }

          for path, snippets in checks.items():
              text = Path(path).read_text(encoding="utf-8")
              for snippet in snippets:
                  if snippet not in text:
                      raise SystemExit(
                          f"Missing Emscripten Lua network/navigation guard in {path}: {snippet!r}"
                      )
          print("Lua Emscripten API guards: OK")
          PY

          grep -Fn 'LuaSocketTCPNone.cpp' "$BUILD_NINJA"
          if grep -Fn 'LuaSocketTCPWebsocket.cpp' "$BUILD_NINJA"; then
            echo "Lua WebSocket backend is compiled into the Yandex build."
            exit 1
          fi
          if grep -Fn 'LuaSocketTCPHttp.cpp' "$BUILD_NINJA"; then
            echo "Lua HTTP socket backend is compiled into the Yandex build."
            exit 1
          fi

          echo "Lua network/navigation API/backend: disabled"

      - name: Validate shared-memory-free browser output
        run: |
          set -euo pipefail
          SAB_COUNT="$(grep -Eio "SharedArrayBuffer" upstream/build/powder.js | wc -l || true)"
          SHARED_MEMORY_COUNT="$(grep -Eio "shared[[:space:]]*:[[:space:]]*true" upstream/build/powder.js | wc -l || true)"
          PTHREAD_FLAG_COUNT="$(grep -Eio -- "-pthread|PTHREAD_POOL_SIZE" upstream/build/powder.js | wc -l || true)"
          echo "SharedArrayBuffer markers: $SAB_COUNT"
          echo "shared:true memory markers: $SHARED_MEMORY_COUNT"
          echo "pthread build-flag markers: $PTHREAD_FLAG_COUNT"
          test "$SAB_COUNT" -eq 0
          test "$SHARED_MEMORY_COUNT" -eq 0
          test "$PTHREAD_FLAG_COUNT" -eq 0
          echo "Browser output is cross-origin-isolation independent."

      - name: Assemble Yandex archive
        run: |
          set -euo pipefail

          mkdir -p dist/src dist/game
          cp index.html styles.css dist/
          cp src/main.js src/yandex.js dist/src/
          cp upstream/build/powder.js dist/game/
          cp upstream/build/powder.wasm dist/game/
          cp upstream/LICENSE dist/LICENSE
          cp SOURCE.md dist/SOURCE.md

          test -f dist/index.html
          SIZE_BYTES="$(du -sb dist | cut -f1)"
          echo "Uncompressed package size: $SIZE_BYTES bytes"
          test "$SIZE_BYTES" -le 100000000

          python3 - <<'PY'
          from pathlib import Path

          bad = []
          unexpected_files = []
          allowed_files = {
              "index.html",
              "styles.css",
              "LICENSE",
              "SOURCE.md",
              "src/main.js",
              "src/yandex.js",
              "game/powder.js",
              "game/powder.wasm",
          }
          for path in Path("dist").rglob("*"):
              rel = path.relative_to("dist").as_posix()
              if any(ch.isspace() or ord(ch) > 0x7F for ch in rel):
                  bad.append(rel)
              if path.is_file() and rel not in allowed_files:
                  unexpected_files.append(rel)

          if bad:
              raise SystemExit(
                  "Yandex archive contains invalid path names: " + ", ".join(bad)
              )
          if unexpected_files:
              raise SystemExit(
                  "Yandex archive contains unexpected release files: "
                  + ", ".join(unexpected_files)
              )
          print("Yandex archive path names: ASCII/no-whitespace OK")
          print("Yandex archive release-file whitelist: OK")
          PY

          python3 tools/check-runtime-network.py dist

          ROOT_INDEX_COUNT="$(find dist -maxdepth 1 -type f -name 'index.html' | wc -l)"
          ALL_INDEX_COUNT="$(find dist -type f -name 'index.html' | wc -l)"
          echo "Root index.html count: $ROOT_INDEX_COUNT"
          echo "Total index.html count: $ALL_INDEX_COUNT"
          test "$ROOT_INDEX_COUNT" -eq 1
          test "$ALL_INDEX_COUNT" -eq 1

          (
            cd dist
            zip -9 -r ../ThePowderToy-Yandex.zip .
          )

          unzip -t ThePowderToy-Yandex.zip >/tmp/tpt-zip-test.log
          cat /tmp/tpt-zip-test.log

          python3 - <<'PY'
          from pathlib import PurePosixPath
          import subprocess

          entries = subprocess.check_output(
              ["unzip", "-Z1", "ThePowderToy-Yandex.zip"],
              text=True,
          ).splitlines()

          if "index.html" not in entries:
              raise SystemExit("Yandex ZIP has no root index.html")

          unsafe = []
          for entry in entries:
              path = PurePosixPath(entry)
              if path.is_absolute() or ".." in path.parts:
                  unsafe.append(entry)

          if unsafe:
              raise SystemExit(
                  "Yandex ZIP contains unsafe paths: " + ", ".join(unsafe)
              )

          print("Yandex ZIP structure: root index and safe paths OK")
          PY

      - name: "Browser smoke test: desktop/mobile, EN/RU"
        run: |
          set -euo pipefail

          cat > dist/sdk.js <<'EOF'
          window.__yandexLoadingReady = false;
          window.__yandexGameplayStarted = false;
          window.__yandexReadyCount = 0;
          window.__yandexSdkEvents = [];
          window.__yandexReadySnapshot = null;
          window.__yandexAdOpenCount = 0;
          window.__yandexAdCloseCount = 0;
          window.YaGames = {
            init: async () => {
              const sdkMode = new URLSearchParams(location.search).get("sdk");
              if (sdkMode === "hang") {
                return new Promise(() => {});
              }
              if (sdkMode === "delay") {
                await new Promise((resolve) => setTimeout(resolve, 11000));
              }
              return {
              environment: {
                i18n: {
                  lang: new URLSearchParams(location.search).get("lang") || "en"
                }
              },
              deviceInfo() {
                const type =
                  new URLSearchParams(location.search).get("device") || "desktop";
                return {
                  type,
                  isMobile() {
                    return type === "mobile";
                  },
                  isTablet() {
                    return type === "tablet";
                  }
                };
              },
              adv: {
                showFullscreenAdv({ callbacks } = {}) {
                  window.__yandexSdkEvents.push("ad-request");
                  callbacks?.onOpen?.();
                  window.__yandexAdOpenCount += 1;
                  window.__yandexSdkEvents.push("ad-open");
                  setTimeout(() => {
                    window.__yandexAdCloseCount += 1;
                    window.__yandexSdkEvents.push("ad-close");
                    callbacks?.onClose?.(true);
                  }, 80);
                }
              },
              features: {
                LoadingAPI: {
                  ready() {
                    window.__yandexLoadingReady = true;
                    window.__yandexReadyCount += 1;
                    window.__yandexSdkEvents.push("ready");
                    const loader = document.getElementById("loader");
                    const canvas = document.getElementById("canvas");
                    window.__yandexReadySnapshot = {
                      loaderHidden: Boolean(loader?.hidden),
                      canvasDisplay: canvas ? getComputedStyle(canvas).display : "",
                      ariaBusy: document.getElementById("app")?.getAttribute("aria-busy") || ""
                    };
                  }
                },
                GameplayAPI: {
                  start() {
                    window.__yandexGameplayStarted = true;
                    window.__yandexSdkEvents.push("gameplay-start");
                  },
                  stop() {
                    window.__yandexGameplayStarted = false;
                    window.__yandexSdkEvents.push("gameplay-stop");
                  }
                }
              },
              __listeners: {},
              on(event, callback) {
                this.__listeners[event] ??= [];
                this.__listeners[event].push(callback);
              },
              emit(event) {
                for (const callback of this.__listeners[event] || []) {
                  callback();
                }
              }
              };
            }
          };
          EOF

          python3 tools/smoke-http-server.py \
            --port 8765 \
            --bind 127.0.0.1 \
            --directory dist \
            --sdk-delay-seconds 15 \
            > /tmp/tpt-http.log 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" 2>/dev/null || true' EXIT
          sleep 1

          TPT_SMOKE_URL=http://127.0.0.1:8765 \
          TPT_SMOKE_ARTIFACT_DIR=test-artifacts \
          python3 tools/browser-smoke.py
          rm -f dist/sdk.js

      - name: Upload browser smoke screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ThePowderToy-Smoke-Screenshots
          path: test-artifacts/*.png
          if-no-files-found: warn
          retention-days: 14

      - name: Upload browser console logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ThePowderToy-Browser-Console
          path: test-artifacts/*-browser-console.json
          if-no-files-found: warn
          retention-days: 14

      - name: Upload browser performance report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ThePowderToy-Performance
          path: test-artifacts/performance.json
          if-no-files-found: warn
          retention-days: 14

      - name: Upload Yandex Games ZIP
        uses: actions/upload-artifact@v4
        with:
          name: ThePowderToy-Yandex
          path: ThePowderToy-Yandex.zip
          if-no-files-found: error
          retention-days: 14


  compatibility:
    name: Firefox / WebKit compatibility smoke
    needs: build
    runs-on: ubuntu-22.04
    timeout-minutes: 25

    steps:
      - name: Checkout Yandex wrapper
        uses: actions/checkout@v4

      - name: Download built Yandex package
        uses: actions/download-artifact@v4
        with:
          name: ThePowderToy-Yandex
          path: compat-package

      - name: Unpack exact release artifact
        run: |
          set -euo pipefail
          mkdir -p dist
          unzip -q compat-package/ThePowderToy-Yandex.zip -d dist
          test -f dist/index.html
          test -f dist/game/powder.js
          test -f dist/game/powder.wasm
          test ! -f dist/sdk.js

      - name: Install Firefox and WebKit test browsers
        run: |
          python3 -m pip install --user --upgrade playwright
          python3 -m playwright install --with-deps firefox webkit

      - name: Run cross-browser release smoke
        run: |
          set -euo pipefail
          python3 -m http.server 8766 --bind 127.0.0.1 --directory dist > /tmp/tpt-compat-http.log 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" 2>/dev/null || true' EXIT
          sleep 1

          TPT_COMPAT_URL=http://127.0.0.1:8766 \
          TPT_COMPAT_ARTIFACT_DIR=compat-artifacts \
          python3 tools/browser-compat-smoke.py

      - name: Upload cross-browser diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ThePowderToy-Cross-Browser
          path: compat-artifacts/
          if-no-files-found: warn
          retention-days: 14
