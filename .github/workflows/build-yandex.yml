name: Build Yandex package

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "index.html"
      - "styles.css"
      - "LICENSE"
      - "SOURCE.md"
      - "src/**"
      - "tools/**"
      - ".github/workflows/build-yandex.yml"

concurrency:
  group: yandex-build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 45

    steps:
      - name: Checkout Yandex wrapper
        uses: actions/checkout@v4

      - name: Checkout official The Powder Toy source
        uses: actions/checkout@v4
        with:
          repository: The-Powder-Toy/The-Powder-Toy
          ref: v100.1.400
          path: upstream

      - name: Install build tools
        run: |
          python3 -m pip install --user --upgrade meson ninja selenium
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Check non-blocking Yandex SDK loader
        run: |
          set -euo pipefail
          if grep -Fn '<script src="/sdk.js"></script>' index.html; then
            echo "Blocking Yandex SDK script tag returned."
            exit 1
          fi
          grep -Fn 'script.src = "/sdk.js";' src/yandex.js
          grep -Fn 'script.async = true;' src/yandex.js
          grep -Fn 'loadYandexSDKScript().then' src/yandex.js
          grep -Fn 'const sdkPromise = initYandexSDK();' src/main.js
          grep -Fn 'await loadScript("./game/powder.js");' src/main.js
          grep -Fn 'const currentSDK = window.ysdk || null;' src/main.js
          grep -Fn 'onYandexSDKReady((currentSDK) => {' src/main.js
          grep -Fn 'await applyPlatformDevice(currentSDK);' src/main.js
          grep -Fn 'const ready = currentSDK.features?.LoadingAPI?.ready;' src/yandex.js
          grep -Fn 'typeof ready !== "function"' src/yandex.js
          grep -Fn 'const start = currentSDK.features?.GameplayAPI?.start;' src/yandex.js
          grep -Fn 'typeof start !== "function"' src/yandex.js
          if grep -Fn 'if (!late)' src/main.js; then
            echo "Async SDK reconciliation is restricted to timeout-only arrivals again."
            exit 1
          fi
          if grep -Fn 'const [currentSDK] = await Promise.all' src/main.js; then
            echo "Engine bootstrap is waiting for Yandex SDK latency again."
            exit 1
          fi
          echo "Yandex SDK async/non-blocking engine bootstrap audit: OK"

      - name: Check local engine preload hints
        run: |
          set -euo pipefail
          grep -Fn 'href="./game/powder.js" as="script"' index.html
          grep -Fn 'href="./game/powder.wasm"' index.html
          grep -Fn 'type="application/wasm"' index.html
          grep -Fn 'crossorigin="anonymous"' index.html
          if grep -En '<link[^>]+rel="preload"[^>]+https?://' index.html; then
            echo "External preload URL found in Yandex wrapper."
            exit 1
          fi
          echo "Local JS/WASM preload audit: OK"

      - name: Check Russian font coverage
        run: |
          python3 tools/check-font.py

      - name: Check complete Russian element localization
        run: |
          python3 tools/check-element-localization.py

      - name: Check Russian options and renderer localization
        run: |
          set -euo pipefail
          # These strings live in the generated localization layer after
          # tools/patch-upstream.py runs; source-level anchors below prevent
          # accidental loss of the high-visibility settings translations.
          grep -Fn 'YW_UI("Air simulation mode", "Режим симуляции воздуха");' tools/patch-upstream.py
          grep -Fn 'YW_UI("Gravity simulation mode", "Режим гравитации");' tools/patch-upstream.py
          grep -Fn 'YW_UI("Simulation framerate cap", "Ограничение FPS симуляции");' tools/patch-upstream.py
          grep -Fn 'YW_UI("Rendering framerate cap", "Ограничение FPS отрисовки");' tools/patch-upstream.py
          grep -Fn 'YW_UI("Fullscreen \\bg- fill the entire screen", "Полноэкранный режим");' tools/patch-upstream.py
          grep -Fn 'YW_UI("Fire effect for gasses", "Эффект огня для газов");' tools/patch-upstream.py
          echo "Russian options/render localization anchors: OK"

      - name: Restore Emscripten build cache
        id: emscripten-build-cache
        uses: actions/cache@v4
        with:
          path: upstream/build
          # The build directory contains object files compiled from sources
          # rewritten by tools/patch-upstream.py. Never fall back to a cache
          # produced by a different patch revision: Ninja can otherwise reuse
          # stale Emscripten objects and silently mix old/new main-loop logic.
          key: tpt-yandex-v100.1.400-emsdk-3.1.72-wasm32-emscripten-static-release-nohttp-${{ runner.os }}-${{ hashFiles('upstream/.github/build.sh') }}-${{ hashFiles('tools/patch-upstream.py') }}

      - name: Check upstream patch script integrity
        run: |
          set -euo pipefail
          python3 -m py_compile tools/patch-upstream.py
          python3 - <<'PY'
          from pathlib import Path

          text = Path("tools/patch-upstream.py").read_text(encoding="utf-8")
          unique_markers = (
              "# Browser performance: remember whether",
              "locale_header.write_text(r'''",
              "game_view.write_text(view_text, encoding=\"utf-8\")",
          )
          for marker in unique_markers:
              count = text.count(marker)
              if count != 1:
                  raise SystemExit(
                      f"patch-upstream.py duplicated/corrupted marker {marker!r}: {count}"
                  )
          if "meson_configure+= from the generated" in text:
              raise SystemExit("patch-upstream.py contains corrupted replacement text")
          print("Upstream patch script syntax/integrity: OK")
          PY

      - name: Apply Yandex Web patches
        run: |
          python3 tools/patch-upstream.py

      - name: Check localized ToolButton captions stay inside bounds
        run: |
          set -euo pipefail
          TOOL_BUTTON="upstream/src/gui/game/ToolButton.cpp"
          TOOL_BUTTON_H="upstream/src/gui/game/ToolButton.h"
          GAME_VIEW="upstream/src/gui/game/GameView.cpp"
          LOCALE="upstream/src/YandexWebLocale.h"
          grep -Fn 'const int yandexWebCaptionWidth = Size.X > 4 ? Size.X - 4 : 0;' "$TOOL_BUTTON"
          grep -Fn 'Graphics::TextSize(buttonDisplayText).X > yandexWebCaptionWidth' "$TOOL_BUTTON"
          grep -Fn 'buttonDisplayText.Substr(0, buttonDisplayText.size() - 1)' "$TOOL_BUTTON"
          grep -Fn 'YandexWebDisplayTextForTest() const' "$TOOL_BUTTON_H"
          grep -Fn 'YandexWeb_TestDustButtonTextWidth' "$GAME_VIEW"
          grep -Fn 'YandexWeb_TestDustButtonWidth' "$GAME_VIEW"
          grep -Fn 'YandexWeb_TestMaxToolButtonOverflow' "$GAME_VIEW"
          grep -Fn 'YandexWeb_TestDustButtonTextWidthValue' "$GAME_VIEW"
          grep -Fn 'YandexWeb_TestDustButtonWidthValue' "$GAME_VIEW"
          grep -Fn 'YandexWeb_TestMaxToolButtonOverflowValue' "$GAME_VIEW"
          if grep -Fq 'static int YandexWeb_TestDustButtonTextWidth =' "$GAME_VIEW" ||
             grep -Fq 'static int YandexWeb_TestDustButtonWidth =' "$GAME_VIEW" ||
             grep -Fq 'static int YandexWeb_TestMaxToolButtonOverflow =' "$GAME_VIEW"; then
            echo "UI diagnostic function/static variable symbol collision returned."
            exit 1
          fi
          if grep -Fn 'maxVisibleCharacters' "$LOCALE"; then
            echo "Russian tool labels are being truncated by character count again."
            exit 1
          fi
          echo "Localized ToolButton pixel-width fitting: OK"

      - name: Check patched TPT source has no browser timing override
        run: |
          set -euo pipefail
          if grep -RIn --include='*.cpp' --include='*.h' 'emscripten_set_main_loop_timing' upstream/src; then
            echo "TPT source still overrides the Emscripten browser main-loop timing."
            exit 1
          fi
          echo "TPT browser timing override audit: OK"

      - name: Check Yandex UI has no external links
        run: |
          set -euo pipefail
          if grep -RInE 'https?://' upstream/src/gui; then
            echo "Absolute external URL remains in player-facing Yandex GUI source."
            exit 1
          fi
          if grep -RInE 'powdertoy\.co\.uk|tpt\.io|irc\.libera\.chat|github\.com/The-Powder-Toy|starcatcher\.us' upstream/src/gui; then
            echo "External service marker remains in player-facing Yandex GUI source."
            exit 1
          fi
          echo "Yandex GUI absolute external-link audit: OK"

      - name: Check browser external navigation is disabled
        run: |
          set -euo pipefail
          PLATFORM_FILE="upstream/src/common/platform/Emscripten.cpp"

          grep -Fn 'Yandex Web: external URI navigation is disabled.' "$PLATFORM_FILE"
          grep -Fn '(void)uri;' "$PLATFORM_FILE"
          grep -Fn 'External URI blocked in Yandex build.' "$PLATFORM_FILE"

          if grep -Fn 'open(UTF8ToString($0))' "$PLATFORM_FILE"; then
            echo "Emscripten Platform::OpenURI can still navigate the browser."
            exit 1
          fi

          if grep -En 'window\.(open|location)|location\.(assign|replace)|document\.location' upstream/src/common/platform/Emscripten.cpp; then
            echo "Browser navigation primitive remains in the Emscripten platform sink."
            exit 1
          fi

          echo "Browser external-navigation sink: disabled"

      - name: Check browser online controllers are compiled out
        run: |
          set -euo pipefail
          CONTROLLER="upstream/src/gui/game/GameController.cpp"
          python3 - <<'PY'
          from pathlib import Path

          text = Path("upstream/src/gui/game/GameController.cpp").read_text(
              encoding="utf-8"
          )
          methods = (
              "void GameController::OpenSearch(String searchText)",
              "void GameController::OpenSaveDone()",
              "void GameController::OpenSavePreview(int saveID, int saveDate, SavePreviewType savePreviewType)",
              "void GameController::OpenSavePreview()",
              "void GameController::OpenLogin()",
              "void GameController::OpenProfile()",
              "void GameController::OpenTags()",
          )
          guard = (
              "#if defined(__EMSCRIPTEN__)\n"
              "\t// Yandex Web: upstream online controller path disabled.\n"
              "\treturn;\n#else"
          )
          for method in methods:
              start = text.find(method)
              if start < 0:
                  raise SystemExit(f"Missing patched controller method: {method}")
              body = text[start:start + 500]
              if guard not in body:
                  raise SystemExit(
                      f"Online controller method is not Emscripten-disabled: {method}"
                  )
          print("Browser upstream online-controller guards: OK")
          PY

      - name: Check player-facing UI has no build diagnostics
        run: |
          set -euo pipefail
          INTRO="upstream/src/gui/game/IntroText.h"
          GAME_VIEW="upstream/src/gui/game/GameView.cpp"

          python3 - <<'PY'
          from pathlib import Path

          intro_text = Path("upstream/src/gui/game/IntroText.h").read_text(
              encoding="utf-8"
          )
          marker = "inline ByteString IntroText()"
          if marker not in intro_text:
              raise SystemExit("IntroText() missing after Yandex patch")

          player_intro = intro_text.split(marker, 1)[1]
          forbidden = (
              "VersionInfo()",
              "NOHTTP",
              "USE_UPDATESERVER",
              "starcatcher",
              "tptserv",
              "powdertoy.co.uk",
              "irc.libera.chat",
              "tpt.io/discord",
              "Server features are disabled",
              "Saves in this build",
              "Серверные функции отключены",
              "Сохранения этой версии",
          )
          found = [value for value in forbidden if value in player_intro]
          if found:
              raise SystemExit(
                  "Technical/network marker remains in player-facing IntroText: "
                  + ", ".join(found)
              )
          print("Player-facing IntroText diagnostics: clean")
          PY

          if grep -EIn 'unavailable in this build|недоступн.{0,20}верс' "$GAME_VIEW"; then
            echo "Technical unavailable-build wording remains in player-facing GameView."
            exit 1
          fi

          python3 - <<'PY'
          from pathlib import Path

          text = Path("upstream/src/gui/game/GameController.cpp").read_text(
              encoding="utf-8"
          )
          required = (
              "void GameController::Install()\n"
              "{\n"
              "#if defined(__EMSCRIPTEN__)\n"
              "\t// Yandex Web: desktop OS installation is not applicable in a browser.\n"
              "\treturn;\n"
              "#else"
          )
          if required not in text:
              raise SystemExit(
                  "Browser GameController::Install() is not guarded from desktop dialogs"
              )
          print("Browser desktop-install dialog guard: OK")
          PY

          echo "Player-facing technical-message audit: OK"

      - name: Check production engine stdout is quiet
        run: |
          set -euo pipefail
          grep -Fn 'const ENGINE_STDOUT_DEBUG =' src/main.js
          grep -Fn 'get("tpt-debug") === "1"' src/main.js
          grep -Fn 'print: (...args) => logEngineStdout(...args)' src/main.js
          if grep -Fn 'print: (...args) => console.log("[TPT]", ...args)' src/main.js; then
            echo "Production Emscripten stdout is still unconditionally mirrored to the browser console."
            exit 1
          fi
          echo "Production engine stdout audit: OK"

      - name: Check Web hot-path optimizations
        run: |
          set -euo pipefail
          SIM="upstream/src/simulation/Simulation.cpp"
          SIM_H="upstream/src/simulation/Simulation.h"
          EDITING="upstream/src/simulation/Editing.cpp"
          LUA_SIM="upstream/src/lua/LuaSimulation.cpp"
          AIR="upstream/src/simulation/Air.cpp"
          RENDERER="upstream/src/graphics/Renderer.cpp"
          RENDERER_H="upstream/src/graphics/Renderer.h"
          MESON="upstream/meson.build"
          BUILD_SH="upstream/.github/build.sh"
          EMSCRIPTEN_PLATFORM="upstream/src/common/platform/Emscripten.cpp"
          GRAVITY_FFT="upstream/src/simulation/gravity/Fft.cpp"
          GAME_CONTROLLER="upstream/src/gui/game/GameController.cpp"

          grep -Fn 'bool yandexWebNeedsFlatten = false;' "$SIM"
          grep -Fn 'if (yandexWebNeedsFlatten)' "$SIM"
          grep -Fn 'bool yandexWebStackingCandidate = false;' "$SIM_H"
          grep -Fn 'bool yandexWebWallsMayExist = true;' "$SIM_H"
          grep -Fn 'bool yandexWebWallCellsDirty = true;' "$SIM_H"
          grep -Fn 'std::vector<int> yandexWebWallCells;' "$SIM_H"
          grep -Fn 'std::vector<int> yandexWebStackingCells;' "$SIM_H"
          grep -Fn 'std::vector<int> yandexWebCountedCells;' "$SIM_H"
          grep -Fn 'void RebuildStackingCounts();' "$SIM_H"
          grep -Fn 'void Simulation::RebuildStackingCounts()' "$SIM"
          grep -Fn 'yandexWebStackingCandidate = false;' "$SIM"
          grep -Fn 'yandexWebStackingCells.clear();' "$SIM"
          grep -Fn 'for (int cell : yandexWebCountedCells)' "$SIM"
          grep -Fn 'yandexWebCountedCells.clear();' "$SIM"
          grep -Fn 'if (cellCount == 0)' "$SIM"
          grep -Fn 'yandexWebCountedCells.push_back(y * XRES + x);' "$SIM"
          grep -Fn 'if (cellCount == 6)' "$SIM"
          grep -Fn 'yandexWebStackingCells.push_back(y * XRES + x);' "$SIM"
          grep -Fn 'if (!yandexWebStackingCandidate)' "$SIM"
          grep -Fn 'std::sort(yandexWebStackingCells.begin(), yandexWebStackingCells.end());' "$SIM"
          grep -Fn 'RebuildStackingCounts();' "$SIM"
          grep -Fn 'for (int i = 0; i < parts.active; ++i)' "$SIM"
          grep -Fn 'ID(r) == i' "$SIM"
          grep -Fn 'for (int i = 0; i < parts.active; i++)' "$SIM"
          grep -Fn 'if (yandexWebWallsMayExist || yandexWebWallCellsDirty)' "$SIM"
          grep -Fn 'bool yandexWebWallsPresent = false;' "$SIM"
          grep -Fn 'yandexWebWallCells.clear();' "$SIM"
          grep -Fn 'yandexWebWallCells.push_back(y * XCELLS + x);' "$SIM"
          grep -Fn 'yandexWebWallsMayExist = yandexWebWallsPresent;' "$SIM"
          grep -Fn 'yandexWebWallCellsDirty = false;' "$SIM"
          grep -Fn 'yandexWebWallsMayExist = false;' "$SIM"
          grep -Fn 'yandexWebWallCellsDirty = true;' "$EDITING"
          grep -Fn 'yandexWebWallsMayExist = true;' "$EDITING"
          grep -Fn 'yandexWebWallCellsDirty = true;' "$LUA_SIM"
          grep -Fn 'yandexWebWallsMayExist = true;' "$LUA_SIM"
          grep -Fn 'if (!sim->yandexWebWallsMayExist)' "$RENDERER"
          grep -Fn 'if (!sim->yandexWebWallCellsDirty)' "$RENDERER"
          grep -Fn 'for (int cell : sim->yandexWebWallCells)' "$RENDERER"
          grep -Fn 'yandexWebDrawWallCell(x, y);' "$RENDERER"
          grep -Fn 'YandexWeb_TestWallRenderHint' upstream/src/gui/game/GameModel.cpp
          grep -Fn 'YandexWeb_TestWallCacheDirty' upstream/src/gui/game/GameModel.cpp
          grep -Fn 'YandexWeb_TestWallCacheSize' upstream/src/gui/game/GameModel.cpp
          grep -Fn 'YandexWeb_TestCreateWallForRenderHint' upstream/src/gui/game/GameModel.cpp
          if [ "$(grep -Fc 'yandexWebWallsMayExist = false;' "$SIM")" -ne 1 ]; then
            echo "Wall renderer hint has an unsafe extra false-assignment."
            exit 1
          fi
          grep -Fn 'bool yandexWebFireActive = false;' "$RENDERER_H"
          grep -Fn 'if(!(renderMode & FIREMODE) || !yandexWebFireActive)' "$RENDERER"
          grep -Fn 'bool yandexWebNextFireActive = false;' "$RENDERER"
          grep -Fn 'yandexWebFireActive = yandexWebNextFireActive;' "$RENDERER"
          grep -Fn 'yandexWebFireActive = false;' "$RENDERER"
          test "$(grep -Fc 'yandexWebFireActive = true;' "$RENDERER")" -ge 4
          grep -Fn 'const auto &signs = sim->signs;' "$RENDERER"
          grep -Fn 'void GameController::ResetAir()' "$GAME_CONTROLLER"
          grep -Fn 'void GameController::ResetSpark()' "$GAME_CONTROLLER"
          test "$(grep -Fc 'for (int i = 0; i < sim->parts.active; i++)' "$GAME_CONTROLLER")" -ge 2
          if grep -A8 -F 'void GameController::ResetAir()' "$GAME_CONTROLLER" | grep -F '< NPART'; then
            echo "ResetAir returned to scanning all particle slots."
            exit 1
          fi
          if grep -A18 -F 'void GameController::ResetSpark()' "$GAME_CONTROLLER" | grep -F '< NPART'; then
            echo "ResetSpark returned to scanning all particle slots."
            exit 1
          fi
          grep -Fn 'bool yandexWebHasEffectiveMass = false;' "$GRAVITY_FFT"
          grep -Fn 'if (!yandexWebHasEffectiveMass)' "$GRAVITY_FFT"
          grep -Fn 'fftGravity->gravIn.mass = gravIn.mass;' "$GRAVITY_FFT"
          grep -Fn 'fftGravity->gravIn.mask = gravIn.mask;' "$GRAVITY_FFT"
          grep -Fn 'gravOut.forceX[p] = 0.0f;' "$GRAVITY_FFT"
          grep -Fn 'gravOut.forceY[p] = 0.0f;' "$GRAVITY_FFT"
          if grep -Fn 'bool yandexWebHasFire = false;' "$RENDERER"; then
            echo "Renderer returned to scanning the complete fire grid before every fire pass."
            exit 1
          fi
          if grep -Fn 'std::vector<sign> signs = sim->signs;' "$RENDERER"; then
            echo "Renderer::DrawSigns still copies the sign vector every frame."
            exit 1
          fi

          python3 - <<'PY'
          from pathlib import Path

          text = Path("upstream/src/simulation/Simulation.cpp").read_text(
              encoding="utf-8"
          )

          recalc_start = text.find("void Simulation::RecalcFreeParticles")
          recalc_end = text.find("\nvoid Parts::Flatten()", recalc_start)
          recalc = text[recalc_start:recalc_end]
          required_recalc = (
              "bool yandexWebNeedsFlatten = false;",
          )
          if recalc_start < 0 or recalc_end < 0:
              raise SystemExit("RecalcFreeParticles bounds missing")
          for marker in required_recalc:
              if marker not in recalc:
                  raise SystemExit(
                      f"RecalcFreeParticles optimization missing: {marker}"
                  )
          if "pmap_count" in recalc:
              raise SystemExit(
                  "RecalcFreeParticles still performs stacking-count bookkeeping"
              )

          before_sim_start = text.find("void Simulation::BeforeSim(bool willUpdate)")
          before_sim_end = text.find("\nvoid Simulation::AfterSim()", before_sim_start)
          before_sim = text[before_sim_start:before_sim_end]
          stacking_branch = (
              "if (force_stacking_check || rng.chance(1, 10))"
          )
          if stacking_branch not in before_sim:
              raise SystemExit("Original stacking RNG decision point changed")
          if before_sim.count("rng.chance(1, 10)") != 1:
              raise SystemExit(
                  "BeforeSim stacking RNG must be consumed exactly once"
              )
          if "RebuildStackingCounts();" not in before_sim:
              raise SystemExit("On-demand stacking-count rebuild missing")
          wall_mark = "bool yandexWebWallsPresent = false;"
          wall_clear = "yandexWebWallCells.clear();"
          wall_push = "yandexWebWallCells.push_back(y * XCELLS + x);"
          wall_publish = "yandexWebWallsMayExist = yandexWebWallsPresent;"
          wall_clean = "yandexWebWallCellsDirty = false;"
          required_wall_scan = (
              wall_mark,
              wall_clear,
              wall_push,
              wall_publish,
              wall_clean,
          )
          for marker in required_wall_scan:
              if marker not in before_sim:
                  raise SystemExit(
                      f"BeforeSim sparse wall-cache marker missing: {marker}"
                  )
          order = [before_sim.find(marker) for marker in required_wall_scan]
          if order != sorted(order):
              raise SystemExit(
                  "BeforeSim sparse wall-cache build/publish order changed"
              )
          if before_sim.find("RebuildStackingCounts();") > before_sim.find("CheckStacking();"):
              raise SystemExit("Stacking counts must rebuild before CheckStacking")


          rebuild_start = text.find("void Simulation::RebuildStackingCounts()")
          rebuild_end = text.find("\nvoid Simulation::CheckStacking()", rebuild_start)
          rebuild = text[rebuild_start:rebuild_end]
          required_rebuild = (
              "for (int cell : yandexWebCountedCells)",
              "yandexWebCountedCells.clear();",
              "yandexWebStackingCells.clear();",
              "yandexWebStackingCandidate = false;",
              "elements[t].Properties & TYPE_ENERGY",
              "if (cellCount == 0)",
              "yandexWebCountedCells.push_back(y * XRES + x);",
              "if (cellCount == 6)",
              "yandexWebStackingCells.push_back(y * XRES + x);",
          )
          if rebuild_start < 0 or rebuild_end < 0:
              raise SystemExit("RebuildStackingCounts bounds missing")
          for marker in required_rebuild:
              if marker not in rebuild:
                  raise SystemExit(
                      f"RebuildStackingCounts optimization missing: {marker}"
                  )

          stacking_start = text.find("void Simulation::CheckStacking()")
          stacking_end = text.find(
              "\nvoid Simulation::UpdateGravityMask()", stacking_start
          )
          stacking = text[stacking_start:stacking_end]
          if "if (!yandexWebStackingCandidate)" not in stacking:
              raise SystemExit("CheckStacking candidate early-out missing")
          if "std::sort(yandexWebStackingCells.begin(), yandexWebStackingCells.end());" not in stacking:
              raise SystemExit("CheckStacking row-major candidate ordering missing")
          if "for (int y = 0; y < YRES; y++)" in stacking:
              raise SystemExit("CheckStacking still scans the complete simulation grid")
          if "for (int cell : yandexWebStackingCells)" not in stacking:
              raise SystemExit("CheckStacking sparse candidate scan missing")

          before_start = text.find("void Simulation::BeforeSim(bool willUpdate)")
          before_end = text.find("\nvoid Simulation::AfterSim()", before_start)
          before = text[before_start:before_end]
          if "for (int nx = 0; nx < XRES; nx++)" in before:
              raise SystemExit("WIRE still scans the complete simulation grid")
          if "for (int i = 0; i < parts.active; ++i)" not in before:
              raise SystemExit("WIRE active-particle scan missing")
          if "ID(r) == i" not in before:
              raise SystemExit("WIRE pmap-visibility guard missing")

          wall_guard = "if (yandexWebWallsMayExist || yandexWebWallCellsDirty)"
          if wall_guard not in before_sim:
              raise SystemExit("wall-free BeforeSim grid-scan guard missing")
          wall_guard_pos = before_sim.find(wall_guard)
          wall_scan_pos = before_sim.find(
              "for (int y = 0; y < YCELLS; y++)",
              wall_guard_pos,
          )
          if wall_scan_pos < 0 or wall_scan_pos < wall_guard_pos:
              raise SystemExit(
                  "wall/air-block full-grid scan escaped the wall-presence guard"
              )

          clear_start = text.find("void Simulation::clear_sim(void)")
          clear_end = text.find("\nbool Simulation::IsWallBlocking", clear_start)
          clear = text[clear_start:clear_end]
          if "memset(pmap_count, 0, sizeof(pmap_count));" not in clear:
              raise SystemExit("clear_sim no longer initializes pmap_count")
          if "yandexWebCountedCells.clear();" not in clear:
              raise SystemExit("clear_sim sparse-count reset missing")

          save_start = text.find("std::unique_ptr<GameSave> Simulation::Save")
          save_end = text.find("\nvoid Simulation::SaveSimOptions", save_start)
          save = text[save_start:save_end]
          if "for (int i = 0; i < NPART; i++)" in save:
              raise SystemExit("Simulation::Save still scans all NPART slots")
          if "for (int i = 0; i < parts.active; i++)" not in save:
              raise SystemExit("Simulation::Save active-range scan missing")

          print("Simulation Web hot-path scope: OK")
          PY

          python3 - <<'PY'
          from pathlib import Path

          text = Path("upstream/src/graphics/Renderer.cpp").read_text(
              encoding="utf-8"
          )
          start = text.find("void Renderer::DrawWalls()")
          end = text.find("\nvoid Renderer::render_fire()", start)
          draw_walls = text[start:end]
          if start < 0 or end < 0:
              raise SystemExit("Renderer::DrawWalls bounds missing")
          required = (
              "if (!sim->yandexWebWallsMayExist)",
              "auto yandexWebDrawWallCell =",
              "if (!sim->yandexWebWallCellsDirty)",
              "for (int cell : sim->yandexWebWallCells)",
              "for (int y = 0; y < YCELLS; ++y)",
          )
          for marker in required:
              if marker not in draw_walls:
                  raise SystemExit(
                      f"Renderer sparse wall path missing: {marker}"
                  )
          if draw_walls.count("for (int y = 0; y < YCELLS; ++y)") != 1:
              raise SystemExit(
                  "Renderer::DrawWalls gained an unexpected full-grid pass"
              )
          print("Renderer sparse wall cache/fallback: OK")
          PY

          python3 - <<'PY'
          from pathlib import Path

          text = Path("upstream/src/simulation/gravity/Fft.cpp").read_text(
              encoding="utf-8"
          )
          exchange_start = text.find("void Gravity::Exchange(")
          create_start = text.find("\nGravityPtr Gravity::Create()", exchange_start)
          exchange = text[exchange_start:create_start]
          work_start = text.find("void GravityImpl::Work()")
          work_end = text.find("\nvoid GravityImpl::Init()", work_start)
          work = text[work_start:work_end]
          if exchange_start < 0 or create_start < 0:
              raise SystemExit("Gravity::Exchange bounds missing")
          if work_start < 0 or work_end < 0:
              raise SystemExit("GravityImpl::Work bounds missing")
          required_exchange = (
              "#if defined(__EMSCRIPTEN__)",
              "if (!fftGravity->initDone)",
              "bool yandexWebHasEffectiveMass = false;",
              "gravIn.mask[p] && gravIn.mass[p] != 0.0f",
              "fftGravity->gravIn.mass = gravIn.mass;",
              "fftGravity->gravIn.mask = gravIn.mask;",
              "return;",
          )
          for marker in required_exchange:
              if marker not in exchange:
                  raise SystemExit(
                      f"Web zero-mass lazy gravity marker missing: {marker}"
                  )
          required_work = (
              "auto value = gravIn.mask[p] ? gravIn.mass[p] : 0.f;",
              "yandexWebHasEffectiveMass |= value != 0.0f;",
              "if (!yandexWebHasEffectiveMass)",
              "gravOut.forceX[p] = 0.0f;",
              "gravOut.forceY[p] = 0.0f;",
              "return;",
              "fftwf_execute(massForward.get());",
          )
          for marker in required_work:
              if marker not in work:
                  raise SystemExit(
                      f"Web zero-mass FFT fast path missing: {marker}"
                  )
          if work.find("if (!yandexWebHasEffectiveMass)") > work.find(
              "fftwf_execute(massForward.get());"
          ):
              raise SystemExit(
                  "zero-mass gravity early-out occurs after the FFT"
              )
          print("Web zero-mass Newtonian gravity fast paths: OK")
          PY

          grep -Fn -- "-Dbuildtype=release" "$BUILD_SH"

          echo "Web hot paths and proven Emscripten build profile: OK"

      - name: Check reachable local UI localization
