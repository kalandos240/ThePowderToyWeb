<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta
    name="viewport"
    content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"
  >
  <meta name="theme-color" content="#000000">
  <title>The Powder Toy</title>

  <!-- Required Yandex Games SDK path for archive-hosted builds. -->
  <script src="/sdk.js"></script>

  <link rel="stylesheet" href="./styles.css">
</head>
<body>
  <main id="app" aria-busy="true">
    <section id="loader" role="status" aria-live="polite">
      <div class="spinner" aria-hidden="true"></div>
      <div id="status">Загрузка The Powder Toy…</div>
    </section>

    <canvas
      id="canvas"
      class="emscripten"
      tabindex="-1"
      aria-label="The Powder Toy"
      oncontextmenu="event.preventDefault()"
    ></canvas>

    <section id="fatal" hidden>
      <h1>Не удалось запустить игру</h1>
      <p id="fatal-message"></p>
      <button id="reload" type="button">Перезапустить</button>
    </section>
  </main>

  <script type="module" src="./src/main.js"></script>
</body>
</html>
