<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta
    name="viewport"
    content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"
  >
  <meta name="theme-color" content="#000000">
  <title>The Powder Toy</title>

  <!-- Required Yandex Games SDK path for archive-hosted builds. -->
  <script src="/sdk.js"></script>

  <link rel="stylesheet" href="./styles.css">
</head>
<body>
  <main id="app" aria-busy="true">
    <section id="loader" role="status" aria-live="polite">
      <div class="spinner" aria-hidden="true"></div>
      <div id="status">Loading The Powder Toy…</div>
    </section>

    <canvas
      id="canvas"
      class="emscripten"
      tabindex="-1"
      aria-label="The Powder Toy"
      oncontextmenu="event.preventDefault()"
    ></canvas>

    <input
      id="mobile-text-input"
      type="text"
      inputmode="text"
      autocomplete="off"
      autocapitalize="off"
      spellcheck="false"
      aria-label="Game text input"
      hidden
    >

    <section id="orientation-gate" role="status" aria-live="polite" hidden>
      <div class="rotate-phone" aria-hidden="true"></div>
      <h1 id="orientation-title">Rotate your device</h1>
      <p id="orientation-message">The Powder Toy is designed for landscape mode.</p>
    </section>

    <section id="fatal" hidden>
      <h1>The game could not be started</h1>
      <p id="fatal-message"></p>
      <button id="reload" type="button">Reload</button>
    </section>
  </main>

  <script type="module" src="./src/main.js"></script>
</body>
</html>
